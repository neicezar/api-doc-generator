<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>API Doc Generator</span>
      </div>

      @if (estado !== 'formulario') {
        <button class="btn-header" (click)="onReiniciar()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.99"/>
          </svg>
          Novo repositório
        </button>
      }
    </div>
  </header>

  <main class="app-main">
    @switch (estado) {
      @case ('formulario') {
        <app-formulario (disparar)="onDisparar($event)" />
      }
      @case ('processando') {
        <app-progresso
          [statusAtual]="statusAtual"
          [mensagem]="mensagemAtual"
          [urlRepositorio]="urlRepositorio"
        />
      }
      @case ('concluido') {
        <app-resultado
          [conteudo]="conteudoMarkdown"
          [codigo]="codigoTarefa"
          [urlRepositorio]="urlRepositorio"
          (reiniciar)="onReiniciar()"
        />
      }
      @case ('erro') {
        <div class="erro-container">
          <div class="erro-icone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <h2 class="erro-titulo">Algo deu errado</h2>
          <p class="erro-mensagem">{{ mensagemErro }}</p>
          <button class="btn-primario" (click)="onReiniciar()">
            Tentar novamente
          </button>
        </div>
      }
    }
  </main>

  <footer class="app-footer">
    <span>API Doc Generator — Projeto de portfólio</span>
  </footer>
</div>
