server:
  port: 8080

spring:
  application:
    name: api-doc-generator

  datasource:
    url: jdbc:postgresql://localhost:5432/apidocgen
    username: apidocgen
    password: apidocgen
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' é conveniente em desenvolvimento, mas numa entrega
      # mais madura o ideal é usar Flyway/Liquibase para versionar o schema.
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: apidocgen
    password: apidocgen

# Chave de API nunca fica hardcoded aqui — vem de variável de ambiente.
# Ex: export OPENAI_API_KEY=sk-...
openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

app:
  # Limite de classes para geração de documentação.
  # Projetos acima desse limite são rejeitados para evitar
  # custo excessivo de API. Ajuste conforme necessário.
  limite-maximo-classes: 400